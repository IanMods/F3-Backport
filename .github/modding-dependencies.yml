# Fabric Loader
- repository: https://maven.fabricmc.net
  groupId: net.fabricmc
  artifactId: fabric-loader
  version: "*"
  properties:
    fabric_loader_version:
      source: version

# Fabric API
- repository: https://maven.fabricmc.net
  groupId: net.fabricmc.fabric-api
  artifactId: fabric-api
  version: "*+${mcVersion}"
  properties:
    fabric_api_version:
      source: version

# Forge
- repository: https://maven.minecraftforge.net/
  groupId: net.minecraftforge
  artifactId: forge
  version: "${mcVersion}-*"
  properties:
    forge_version:
      source: version

# NeoForge
- repository: https://maven.neoforged.net/releases/
  groupId: net.neoforged
  artifactId: neoforge
  version: "${mcMinor}.${mcPatch}.*"
  properties:
    neoforge_version:
      source: version

# Parchment
- repository: https://maven.parchmentmc.org/
  groupId: org.parchmentmc.data
  artifactId: parchment-${mcVersion}
  version: "*"
  properties:
    parchment_version:
      source: version

# DevAuth
- repository: https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1
  groupId: me.djtheredstoner
  artifactId: DevAuth-fabric
  version: "*"
  properties:
    devauth_version:
      source: version

# Forge Config API Port
- repository: https://raw.githubusercontent.com/Fuzss/modresources/main/maven/
  groupId: fuzs.forgeconfigapiport
  artifactId: forgeconfigapiport-fabric
  version: "${mcMinor}.${mcPatch}.*"
  properties:
    forge_config_api_port_version:
      source: version

# Mod Menu
- repository: https://maven.terraformersmc.com/releases/
  groupId: com.terraformersmc
  artifactId: modmenu
  version: "11.*"
  properties:
    modmenu_version:
      source: version
